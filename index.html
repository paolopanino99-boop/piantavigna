<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La carta dei vini - Piantavigna</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa; /* Sfondo bianco caldo */
            color: #1a1a1a; /* Carattere scuro antracite */
            overflow-x: hidden;
            min-height: 100vh;
        }
        .font-handwriting {
            font-family: 'Caveat', cursive;
        }
        .text-ocra {
            color: #b08968;
        }
        .bg-ocra {
            background-color: #b08968;
        }
        .border-ocra {
            border-color: #b08968;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto">

    <header class="text-center my-6 border-b border-stone-300 pb-6">
        <!-- Logo e Logotipo Piantavigna -->
        <div class="flex flex-col items-center justify-center gap-3 mb-4">
            <img src="https://i.ibb.co/XMcmLz5/logo-piantavigna.png" alt="Logo Piantavigna" class="w-16 h-16 md:w-20 md:h-20 object-contain">
            <img src="https://i.ibb.co/v4876gpM/logotipo-piantavigna.png" alt="Piantavigna" class="h-8 md:h-10 object-contain">
        </div>
        
        <!-- Interruttore Carta / Mescita / Superalcolici -->
        <div class="flex justify-center mt-4">
            <div class="inline-flex flex-wrap justify-center bg-stone-200/70 p-1.5 rounded-2xl border border-stone-300 shadow-sm gap-1.5">
                <button onclick="switchView('carta')" id="tab-carta" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer bg-stone-900 text-white shadow-sm">
                    🍷 Carta dei Vini
                </button>
                <button onclick="switchView('mescita')" id="tab-mescita" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer text-stone-700 hover:bg-stone-300/50">
                    🥂 Oggi in mescita
                </button>
                <button onclick="switchView('superalcolici')" id="tab-superalcolici" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer text-stone-700 hover:bg-stone-300/50">
                    🥃 Superalcolici
                </button>
            </div>
        </div>

        <!-- Messaggio di stato ed errori -->
        <div id="status-loading" class="text-xs text-stone-700 bg-stone-200 p-2.5 rounded-xl mt-3 font-semibold hidden border border-stone-300 max-w-md mx-auto"></div>
    </header>

    <section class="mb-8 space-y-4">
        
        <!-- Tasti Tipologia Vini (Visibili solo in Carta e Mescita) -->
        <div id="wine-filters-section">
            <div id="wine-type-buttons" class="grid grid-cols-4 sm:flex sm:flex-wrap items-center justify-center gap-1.5 py-1">
                <button onclick="filterType('Tutti', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-stone-900 text-white rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm cursor-pointer">Tutti</button>
                <button onclick="filterType('rosso', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Rossi</button>
                <button onclick="filterType('bianco', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Bianchi</button>
                <button onclick="filterType('arancione', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Arancione</button>
                <button onclick="filterType('rosa', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Rosa</button>
                <button onclick="filterType('franciacorta', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Franciacorta</button>
                <button onclick="filterType('altre bolle', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Altre Bolle</button>
                <button onclick="filterType('champagne', this)" class="cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 cursor-pointer">Champagne</button>
            </div>
        </div>

        <!-- Tasti Categoria Superalcolici -->
        <div id="spirits-filters-section" class="hidden">
            <div id="spirits-type-buttons" class="flex flex-wrap items-center justify-center gap-1.5 py-1">
                <!-- Generato dinamicamente via JS -->
            </div>
        </div>

        <!-- Barra di Ricerca Testuale -->
        <div class="relative pt-1">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pt-1 pointer-events-none text-stone-400 text-sm">🔍</span>
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="Cerca nella carta..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-stone-300 rounded-xl text-xs font-semibold text-stone-900 placeholder-stone-400 focus:outline-none focus:border-stone-500 transition shadow-xs">
        </div>

        <!-- Filtri Prezzo e Tasto Random -->
        <div id="price-and-random-section" class="flex flex-col sm:flex-row gap-3 pt-1 border-t border-stone-300">
            <div class="flex gap-2 flex-1">
                <button onclick="filterPrice('ECONOMY')" id="btn-economy" class="price-btn flex-1 py-2.5 bg-white text-stone-700 border border-stone-300 rounded-xl text-xs font-bold tracking-widest transition active:scale-95 shadow-xs cursor-pointer hover:border-stone-400">
                    💰 ECONOMY <span class="block text-[10px] font-semibold tracking-normal text-stone-500">Fino a 30€</span>
                </button>
                <button onclick="filterPrice('BUSINESS')" id="btn-business" class="price-btn flex-1 py-2.5 bg-white text-stone-700 border border-stone-300 rounded-xl text-xs font-bold tracking-widest transition active:scale-95 shadow-xs cursor-pointer hover:border-stone-400">
                    💼 BUSINESS <span class="block text-[10px] font-semibold tracking-normal text-stone-500">31€ - 50€</span>
                </button>
                <button onclick="filterPrice('POWER')" id="btn-power" class="price-btn flex-1 py-2.5 bg-white text-stone-700 border border-stone-300 rounded-xl text-xs font-bold tracking-widest transition active:scale-95 shadow-xs cursor-pointer hover:border-stone-400">
                    ⚡ POWER <span class="block text-[10px] font-semibold tracking-normal text-stone-500">Sopra 50€</span>
                </button>
            </div>
            <button onclick="suggestRandomWine()" class="w-full sm:w-auto px-6 py-2.5 bg-[#b08968] hover:bg-[#9c7657] text-white rounded-xl text-xs font-black tracking-wider transition active:scale-95 shadow-md uppercase cursor-pointer">
                MA CHE NE SO. FAI TU.
            </button>
        </div>
    </section>

    <main id="wine-list" class="grid grid-cols-1 md:grid-cols-2 gap-5">
    </main>

    <!-- Modale Dettaglio -->
    <div id="wine-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 items-center justify-center p-4" onclick="closeModal()">
        <div class="bg-white text-stone-900 p-6 md:p-8 rounded-3xl max-w-lg w-full border border-stone-200 shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-900 text-2xl font-sans">&times;</button>
            <div id="modal-badge-container" class="flex flex-wrap gap-1"></div>
            
            <h3 id="modal-wine-cantina" class="font-handwriting text-3xl md:text-4xl text-[#b08968] mt-3 font-bold leading-tight"></h3>
            <p id="modal-wine-name" class="text-stone-800 text-base mt-1 font-semibold"></p>
            <p id="modal-wine-uve" class="text-stone-600 text-xs mt-2 font-medium flex items-center gap-1"></p>
            
            <div class="border-t border-stone-200 my-4 pt-4 space-y-2 text-sm text-stone-700">
                <p id="modal-wine-geo"></p>
                <div class="flex justify-between items-center pt-1">
                    <span id="modal-price-label" class="text-stone-500 text-xs uppercase tracking-wider font-bold">Prezzo Bottiglia</span>
                    <p id="modal-wine-price" class="text-[#b08968] font-bold text-lg"></p>
                </div>
            </div>
            <div id="modal-desc-box" class="bg-stone-100 p-4 rounded-xl border border-stone-200 mt-4 hidden">
                <h4 class="text-xs uppercase tracking-wider text-[#b08968] font-bold mb-2 font-sans">Nota di Degustazione</h4>
                <p id="modal-wine-desc" class="text-base text-stone-700 leading-relaxed italic"></p>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1UT4XCg9_NTM1otqoqU8HhwI14l1ulWnO7WEDF8wN1sc/edit?gid=494726101#gid=494726101";
        
        let wines = [];
        let spirits = [];
        
        let currentView = 'carta'; 
        let currentFilter = 'Tutti';
        let currentSpiritFilter = 'Tutti';
        let currentPriceFilter = 'Tutti'; 
        let searchQuery = '';
        
        let isWineLoaded = false;
        let isSpiritsLoaded = false;

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function parsePrice(val) {
            if (val === undefined || val === null || val === '') return 0;
            if (typeof val === 'number') return val;
            let str = String(val).replace(',', '.').replace(/[^0-9.-]+/g, "");
            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        window.googleDocCallback = function(data) {
            isWineLoaded = true;
            const statusEl = document.getElementById('status-loading');
            try {
                if (!data || !data.table || !data.table.rows) {
                    statusEl.innerText = "⚠️ Il foglio Google dei vini è vuoto o non accessibile pubblicamente.";
                    statusEl.classList.remove('hidden');
                    return;
                }
                const rows = data.table.rows;
                const cols = data.table.cols.map(c => c.label ? c.label.toLowerCase().trim() : '');
                
                const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                wines = shuffleArray(validRows.map(row => {
                    const obj = {};
                    row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                    
                    const checkBool = (val) => val !== undefined && val !== null && String(val).toUpperCase().trim() === 'TRUE';
                    const prezzoBicchiereVal = parsePrice(obj.bicchiere);

                    return {
                        cantina: obj.cantina ? String(obj.cantina).trim() : '',
                        nome: obj.nome ? String(obj.nome).trim() : '',
                        tipo: obj.tipo ? String(obj.tipo).toLowerCase().trim() : '',
                        regione: obj.regione ? String(obj.regione).trim() : '',
                        zona: obj.zona ? String(obj.zona).trim() : '',
                        uve: obj.uve ? String(obj.uve).trim() : '',
                        anno: obj.anno ? parseInt(obj.anno) : '',
                        prezzo: parsePrice(obj.prezzo),
                        prezzoBicchiere: prezzoBicchiereVal,
                        disponibile: obj.disponibile !== undefined ? checkBool(obj.disponibile) : true,
                        doc: obj.doc ? String(obj.doc).trim() : '',
                        descrizione: obj.descrizione ? String(obj.descrizione).trim() : '',
                        sottotipo: obj.sottotipo ? String(obj.sottotipo).trim() : '',
                    };
                }));

                if (currentView !== 'superalcolici') renderContent();
                checkLoadingStatus();
            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ Errore nell'elaborazione dei dati dei vini.";
                statusEl.classList.remove('hidden');
            }
        };

        window.googleSpiritsCallback = function(data) {
            isSpiritsLoaded = true;
            try {
                if (!data || !data.table || !data.table.rows) return;
                const rows = data.table.rows;
                const cols = data.table.cols.map(c => c.label ? c.label.toLowerCase().trim() : '');
                
                const validRows = rows.filter(row => row && row.c && row.c[cols.indexOf('nome')] && row.c[cols.indexOf('nome')].v);
                spirits = validRows.map(row => {
                    const obj = {};
                    row.c.forEach((cell, i) => { if (cols[i]) obj[cols[i]] = cell ? cell.v : ''; });
                    const checkBool = (val) => val !== undefined && val !== null && String(val).toUpperCase().trim() === 'TRUE';

                    return {
                        cantina: obj.produttore ? String(obj.produttore).trim() : (obj.cantina ? String(obj.cantina).trim() : ''),
                        nome: obj.nome ? String(obj.nome).trim() : '',
                        categoria: obj.categoria ? String(obj.categoria).trim() : 'Altro',
                        prezzo: parsePrice(obj.prezzo),
                        disponibile: obj.disponibile !== undefined ? checkBool(obj.disponibile) : true,
                        descrizione: obj.descrizione ? String(obj.descrizione).trim() : '',
                    };
                });
                buildSpiritsFilterButtons();
                if (currentView === 'superalcolici') renderContent();
                checkLoadingStatus();
            } catch (error) {
                console.error("Errore superalcolici:", error);
            }
        };

        function checkLoadingStatus() {
            if (isWineLoaded && isSpiritsLoaded) {
                document.getElementById('status-loading').classList.add('hidden');
            }
        }

        function loadDataViaJSONP() {
            const statusEl = document.getElementById('status-loading');
            const matches = GOOGLE_SHEET_URL.match(/\/d\/([^/]+)/);
            if (!matches || !matches[1]) { 
                statusEl.innerText = "❌ Link del Google Sheet non valido."; 
                statusEl.classList.remove('hidden');
                return; 
            }
            
            statusEl.innerText = "⏳ Caricamento dati in corso...";
            statusEl.classList.remove('hidden');
            
            const scriptWine = document.createElement('script');
            scriptWine.src = `https://docs.google.com/spreadsheets/d/${matches[1]}/gviz/tq?tqx=responseHandler:googleDocCallback&t=${Date.now()}`;
            document.body.appendChild(scriptWine);

            const scriptSpirits = document.createElement('script');
            scriptSpirits.src = `https://docs.google.com/spreadsheets/d/${matches[1]}/gviz/tq?sheet=superalcolici&tqx=responseHandler:googleSpiritsCallback&t=${Date.now()}`;
            document.body.appendChild(scriptSpirits);
        }

        function switchView(view) {
            currentView = view;
            searchQuery = '';
            document.getElementById('search-input').value = '';

            const tabCarta = document.getElementById('tab-carta');
            const tabMescita = document.getElementById('tab-mescita');
            const tabSuperalcolici = document.getElementById('tab-superalcolici');

            const activeTabClass = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer bg-stone-900 text-white shadow-sm";
            const inactiveTabClass = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition cursor-pointer text-stone-700 hover:bg-stone-300/50";

            tabCarta.className = view === 'carta' ? activeTabClass : inactiveTabClass;
            tabMescita.className = view === 'mescita' ? activeTabClass : inactiveTabClass;
            tabSuperalcolici.className = view === 'superalcolici' ? activeTabClass : inactiveTabClass;

            const wineFilters = document.getElementById('wine-filters-section');
            const spiritsFilters = document.getElementById('spirits-filters-section');
            const priceAndRandom = document.getElementById('price-and-random-section');

            if (view === 'superalcolici') {
                wineFilters.classList.add('hidden');
                spiritsFilters.classList.remove('hidden');
                priceAndRandom.classList.add('hidden');
            } else {
                wineFilters.classList.remove('hidden');
                spiritsFilters.classList.add('hidden');
                priceAndRandom.classList.remove('hidden');
            }

            renderContent();
        }

        function filterType(type, element) {
            currentFilter = type;
            updateButtonStyles(type, element);
            renderContent();
        }

        function filterSpiritCategory(cat, element) {
            currentSpiritFilter = cat;
            updateSpiritButtonStyles(element);
            renderContent();
        }

        function updateButtonStyles(activeType, element) {
            document.querySelectorAll('#wine-type-buttons .cat-btn').forEach(btn => {
                btn.className = "cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 focus:outline-none cursor-pointer";
            });
            if (element) {
                element.className = "cat-btn col-span-2 sm:col-span-auto px-3 py-2 sm:py-1.5 bg-stone-900 text-white rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm focus:outline-none cursor-pointer";
            }
        }

        function updateSpiritButtonStyles(element) {
            document.querySelectorAll('#spirits-type-buttons .spirit-cat-btn').forEach(btn => {
                btn.className = "spirit-cat-btn px-3 py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 focus:outline-none cursor-pointer";
            });
            if (element) {
                element.className = "spirit-cat-btn px-3 py-1.5 bg-stone-900 text-white rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm focus:outline-none cursor-pointer";
            }
        }

        function buildSpiritsFilterButtons() {
            const container = document.getElementById('spirits-type-buttons');
            const categories = [...new Set(spirits.map(s => s.categoria).filter(Boolean))].sort();
            
            let html = `<button onclick="filterSpiritCategory('Tutti', this)" class="spirit-cat-btn px-3 py-1.5 bg-stone-900 text-white rounded-full text-[11px] font-bold uppercase tracking-wider shadow-sm focus:outline-none cursor-pointer">Tutti</button>`;
            categories.forEach(cat => {
                html += `<button onclick="filterSpiritCategory('${cat}', this)" class="spirit-cat-btn px-3 py-1.5 bg-white text-stone-700 hover:bg-stone-200 rounded-full text-[11px] font-bold uppercase tracking-wider transition border border-stone-300 focus:outline-none cursor-pointer">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function filterPrice(mode) {
            const btnEconomy = document.getElementById('btn-economy');
            const btnBusiness = document.getElementById('btn-business');
            const btnPower = document.getElementById('btn-power');

            const defaultClass = "price-btn flex-1 py-2.5 bg-white text-stone-700 border border-stone-300 rounded-xl text-xs font-bold tracking-widest transition active:scale-95 shadow-xs cursor-pointer hover:border-stone-400";
            btnEconomy.className = defaultClass;
            btnBusiness.className = defaultClass;
            btnPower.className = defaultClass;

            if (currentPriceFilter === mode) {
                currentPriceFilter = 'Tutti';
            } else {
                currentPriceFilter = mode;
                const activeBtn = mode === 'ECONOMY' ? btnEconomy : (mode === 'BUSINESS' ? btnBusiness : btnPower);
                activeBtn.className = "price-btn flex-1 py-2.5 bg-stone-900 text-white border-stone-900 rounded-xl text-xs font-bold tracking-widest transition active:scale-95 shadow-md cursor-pointer";
            }
            renderContent();
        }

        function handleSearch() {
            const input = document.getElementById('search-input');
            searchQuery = input.value.toLowerCase().trim();
            renderContent();
        }

        function suggestRandomWine() {
            if (wines.length === 0) return;
            
            const eligibleWines = wines.filter(w => {
                if (!w.disponibile) return false;
                if (currentView === 'mescita' && w.prezzoBicchiere <= 0) return false;

                let matchesFilter = false;
                const activeFilterLower = currentFilter.toLowerCase().trim();
                const wineTipoLower = w.tipo ? w.tipo.toLowerCase().trim() : '';
                
                if (activeFilterLower === 'tutti') { 
                    matchesFilter = true; 
                } else if (activeFilterLower === 'champagne') {
                    matchesFilter = w.champagne === true || wineTipoLower === 'champagne';
                } else { 
                    matchesFilter = wineTipoLower === activeFilterLower; 
                }

                let targetPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                let matchesPrice = true;
                if (currentPriceFilter === 'ECONOMY') matchesPrice = targetPrice <= 30;
                if (currentPriceFilter === 'BUSINESS') matchesPrice = targetPrice >= 31 && targetPrice <= 50;
                if (currentPriceFilter === 'POWER') matchesPrice = targetPrice > 50;

                let matchesSearch = true;
                if (searchQuery) {
                    const fullText = `${w.cantina} ${w.nome} ${w.uve} ${w.regione} ${w.zona} ${w.doc} ${w.anno}`.toLowerCase();
                    matchesSearch = fullText.includes(searchQuery);
                }

                return matchesFilter && matchesPrice && matchesSearch;
            });

            if (eligibleWines.length === 0) {
                alert("Nessun vino disponibile corrisponde ai filtri e alla ricerca attualmente selezionati.");
                return;
            }

            const randomIndex = Math.floor(Math.random() * eligibleWines.length);
            const selectedWine = eligibleWines[randomIndex];
            
            const globalIndex = wines.findIndex(w => w.nome === selectedWine.nome && w.cantina === selectedWine.cantina && w.anno === selectedWine.anno);
            if (globalIndex !== -1) { openModal(globalIndex, 'wine'); }
        }

        function openModal(index, type = 'wine') {
            if (type === 'spirit') {
                const s = spirits[index];
                if (!s) return;
                document.getElementById('modal-badge-container').innerHTML = `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-stone-200 text-stone-700 border border-stone-300">${s.categoria || 'Superalcolico'}</span>`;
                document.getElementById('modal-wine-cantina').innerText = s.cantina || '';
                document.getElementById('modal-wine-name').innerText = s.nome;
                document.getElementById('modal-wine-uve').innerHTML = '';
                document.getElementById('modal-wine-geo').innerHTML = '';
                document.getElementById('modal-price-label').innerText = 'Prezzo';
                document.getElementById('modal-wine-price').innerText = `${s.prezzo ? s.prezzo.toFixed(2) : '0.00'} €`;
                
                const descBox = document.getElementById('modal-desc-box');
                if (s.descrizione && s.descrizione.length > 0) {
                    document.getElementById('modal-wine-desc').innerText = s.descrizione;
                    descBox.classList.remove('hidden');
                } else {
                    descBox.classList.add('hidden');
                }
                document.getElementById('wine-modal').classList.replace('hidden', 'flex');
                return;
            }

            const w = wines[index];
            if (!w) return;
            const docBadge = w.doc ? `<span class="text-[10px] font-sans font-bold tracking-wider bg-stone-200 text-stone-800 px-1.5 py-0.5 rounded border border-stone-300 ml-2 uppercase">${w.doc}</span>` : '';
            let labels = [];
            if (w.sottotipo) labels.push(w.sottotipo);
            if (currentView === 'mescita' || w.prezzoBicchiere > 0) labels.push('In Mescita');
            
            const badgesHtml = labels.map(l => `<span class="text-[9px] font-medium px-2 py-0.5 rounded-full uppercase tracking-wider bg-stone-200 text-stone-700 border border-stone-300">${l}</span>`).join('') + docBadge;
            
            document.getElementById('modal-badge-container').innerHTML = badgesHtml;
            document.getElementById('modal-wine-cantina').innerText = w.cantina;
            document.getElementById('modal-wine-name').innerHTML = `${w.nome} <span class="text-sm font-sans text-stone-500 ml-1 font-normal">${w.anno || ''}</span>`;
            document.getElementById('modal-wine-uve').innerHTML = `🍇 Uve: <span class="text-stone-800 font-sans font-normal">${w.uve || 'N/D'}</span>`;
            document.getElementById('modal-wine-geo').innerHTML = `📍 Denominazione: <b>${w.zona || 'N/D'}</b> &bull; Regione: <b>${w.regione || 'N/D'}</b>`;
            
            const isMescitaView = currentView === 'mescita';
            document.getElementById('modal-price-label').innerText = isMescitaView ? 'Prezzo Calice' : 'Prezzo Bottiglia';
            const activePrice = isMescitaView ? w.prezzoBicchiere : w.prezzo;
            document.getElementById('modal-wine-price').innerText = `${activePrice ? activePrice.toFixed(2) : '0.00'} €`;
            
            const descBox = document.getElementById('modal-desc-box');
            if (w.descrizione && w.descrizione.length > 0) {
                document.getElementById('modal-wine-desc').innerText = w.descrizione;
                descBox.classList.remove('hidden');
            } else {
                descBox.classList.add('hidden');
            }
            
            document.getElementById('wine-modal').classList.replace('flex', 'hidden'); // Sicurezza reset
            document.getElementById('wine-modal').classList.replace('hidden', 'flex');
        }

        function closeModal() { document.getElementById('wine-modal').classList.replace('flex', 'hidden'); }

        function renderContent() {
            const container = document.getElementById('wine-list');
            container.innerHTML = '';

            if (currentView === 'superalcolici') {
                let filteredSpirits = spirits.map((s, index) => ({...s, originalIndex: index})).filter(s => {
                    if (!s.disponibile) return false;
                    let matchesCat = currentSpiritFilter === 'Tutti' || s.categoria.toLowerCase() === currentSpiritFilter.toLowerCase();
                    let matchesSearch = true;
                    if (searchQuery) {
                        const fullText = `${s.cantina} ${s.nome} ${s.categoria} ${s.descrizione}`.toLowerCase();
                        matchesSearch = fullText.includes(searchQuery);
                    }
                    return matchesCat && matchesSearch;
                });

                if (filteredSpirits.length === 0) {
                    container.innerHTML = `<p class="col-span-full text-center text-stone-500 bg-white p-6 rounded-2xl font-medium text-sm border border-stone-200 shadow-xs">Nessun superalcolico trovato.</p>`;
                    return;
                }

                filteredSpirits.forEach(s => {
                    container.innerHTML += `
                        <div onclick="openModal(${s.originalIndex}, 'spirit')" class="bg-white p-5 rounded-2xl border border-stone-200 flex flex-col justify-between transition duration-200 shadow-sm cursor-pointer hover:border-stone-400 hover:shadow-md active:scale-[0.99]">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-stone-100 text-stone-700 border border-stone-300">${s.categoria || 'Superalcolico'}</span>
                                    <span class="text-[#b08968] font-bold font-sans">${s.prezzo ? s.prezzo.toFixed(2) : '0.00'} €</span>
                                </div>
                                <h3 class="font-handwriting text-2xl text-stone-900 mt-3 font-bold leading-tight">
                                    ${s.cantina ? s.cantina : s.nome}
                                </h3>
                                <p class="text-stone-700 text-sm mt-0.5 font-medium">
                                    ${s.cantina ? s.nome : ''}
                                </p>
                                ${s.descrizione ? `<p class="text-stone-500 text-xs mt-2 italic line-clamp-2">${s.descrizione}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
                return;
            }

            let filteredWines = wines.map((w, index) => ({...w, originalIndex: index})).filter(w => {
                if (!w.disponibile) return false;
                if (currentView === 'mescita' && w.prezzoBicchiere <= 0) return false;

                let matchesFilter = false;
                const activeFilterLower = currentFilter.toLowerCase().trim();
                const wineTipoLower = w.tipo ? w.tipo.toLowerCase().trim() : '';
                
                if (activeFilterLower === 'tutti') { 
                    matchesFilter = true; 
                } else if (activeFilterLower === 'champagne') {
                    matchesFilter = w.champagne === true || wineTipoLower === 'champagne';
                } else { 
                    matchesFilter = wineTipoLower === activeFilterLower; 
                }
                
                let targetPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                let matchesPrice = true;
                if (currentPriceFilter === 'ECONOMY') matchesPrice = targetPrice <= 30;
                if (currentPriceFilter === 'BUSINESS') matchesPrice = targetPrice >= 31 && targetPrice <= 50;
                if (currentPriceFilter === 'POWER') matchesPrice = targetPrice > 50;

                let matchesSearch = true;
                if (searchQuery) {
                    const fullText = `${w.cantina} ${w.nome} ${w.uve} ${w.regione} ${w.zona} ${w.doc} ${w.anno}`.toLowerCase();
                    matchesSearch = fullText.includes(searchQuery);
                }

                return matchesFilter && matchesPrice && matchesSearch;
            });

            if (currentView === 'mescita') {
                const orderMap = {
                    'franciacorta': 1,
                    'altre bolle': 2,
                    'champagne': 3,
                    'bianco': 4,
                    'rosso': 5,
                    'rosa': 6,
                    'arancione': 7
                };
                filteredWines.sort((a, b) => {
                    const typeA = a.tipo ? a.tipo.toLowerCase().trim() : '';
                    const typeB = b.tipo ? b.tipo.toLowerCase().trim() : '';
                    return (orderMap[typeA] || 99) - (orderMap[typeB] || 99);
                });
            }

            if(filteredWines.length === 0) {
                const emptyMsg = currentView === 'mescita' 
                    ? "Nessun vino in mescita rispecchia i filtri selezionati." 
                    : "Nessun vino rispecchia i filtri selezionati.";
                container.innerHTML = `<p class="col-span-full text-center text-stone-500 bg-white p-6 rounded-2xl font-medium text-sm border border-stone-200 shadow-xs">${emptyMsg}</p>`;
                return;
            }

            filteredWines.forEach(w => {
                let badgeLabel = w.sottotipo || 'Vino';

                const docBadge = w.doc ? `<span class="text-[10px] font-sans font-bold tracking-wider bg-stone-100 text-stone-800 px-1.5 py-0.5 rounded border border-stone-300 ml-2 uppercase">${w.doc}</span>` : '';
                const geoString = w.zona ? `${w.zona} &bull; ${w.regione}` : w.regione;
                const displayPrice = currentView === 'mescita' ? w.prezzoBicchiere : w.prezzo;
                const priceLabelSuffix = currentView === 'mescita' ? ' € <span class="text-[11px] font-medium text-stone-500">calice</span>' : ' €';

                container.innerHTML += `
                    <div onclick="openModal(${w.originalIndex}, 'wine')" class="bg-white p-5 rounded-2xl border border-stone-200 flex flex-col justify-between transition duration-200 shadow-sm cursor-pointer hover:border-stone-400 hover:shadow-md active:scale-[0.99]">
                        <div>
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider bg-stone-100 text-stone-700 border border-stone-300">${badgeLabel}</span>
                                <span class="text-[#b08968] font-bold font-sans">${displayPrice ? displayPrice.toFixed(2) : '0.00'}${priceLabelSuffix}</span>
                            </div>
                            <h3 class="font-handwriting text-2xl text-stone-900 mt-3 font-bold leading-tight">
                                ${w.cantina}
                            </h3>
                            <div class="text-stone-700 text-sm mt-1 font-semibold flex items-center flex-wrap">
                                <span class="font-handwriting text-2xl font-bold leading-none mr-2">${w.nome}</span>
                                <span class="text-xs font-sans text-stone-500 font-normal">${w.anno || ''}</span>
                                ${docBadge}
                            </div>
                            <p class="text-stone-500 text-xs mt-2 font-medium flex items-center gap-1">
                                🍇 Uve: <span class="font-normal text-stone-700">${w.uve || 'N/D'}</span>
                            </p>
                            <p class="text-stone-500 text-xs mt-1.5 flex items-center gap-1 font-medium">📍 ${geoString}</p>
                        </div>
                    </div>
                `;
            });
        }

        loadDataViaJSONP();
    </script>
</body>
</html>
